[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "injeval"
version = "0.1.0"
description = "Prompt-injection safety eval for tool-using LLM agents, with deterministic graders"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
injeval = "injeval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
injeval = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[dev]"
      - run: pytest -q
      - name: Offline dry run of the full matrix
        run: |
          injeval run --model scripted:gullible --out /tmp/dry --fresh > /dev/null
          injeval run --model scripted:safe --out /tmp/dry --fresh > /dev/null
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t injeval .
      - run: docker run --rm --entrypoint pytest injeval -q
